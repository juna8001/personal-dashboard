<div class="user-control">

    <div id="logged-out" class="user-control__group" style="display: none;">
        <button id="login-button" class="user-control__button">
            Log in
        </button>

        <button id="signup-button" class="user-control__button user-control__button--primary">
            Sign up
        </button>
    </div>

    <div id="logged-in" class="user-control__group" style="display: none;">
        <span id="user-email" class="user-control__user"></span>

        <button id="logout-button" class="user-control__button">
            Log out
        </button>
    </div>

    <dialog id="auth-dialog" class="auth-dialog">
        <form id="auth-form" class="auth-dialog__form">

            <h2 id="auth-title">Log in</h2>

            <input
                id="auth-email"
                type="email"
                placeholder="Email"
                required
            >

            <input
                id="auth-password"
                type="password"
                placeholder="Password"
                required
            >

            <p id="auth-error" class="auth-dialog__error"></p>

            <div class="auth-dialog__buttons">
                <button type="button" id="auth-cancel">
                    Cancel
                </button>

                <button type="submit" class="user-control__button--primary">
                    Continue
                </button>
            </div>

        </form>
    </dialog>

</div>

<script src="{{ '/assets/js/user-control.js' | relative_url }}"></script>
